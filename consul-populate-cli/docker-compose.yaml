services:

  consul:
    image: hashicorp/consul:1.22.7
    hostname: consul
    ports:
      # dev-mode Consul has no ACLs: anyone who reaches this port can read and write the KV, so keep it on this machine
      - "127.0.0.1:8500:8500"
    healthcheck:
      test: [ "CMD", "consul", "members" ]
      interval: 2s
      timeout: 3s
      retries: 15

  consul-populate:
    image: frogdevelopment/consul-populate:1.4.0-SNAPSHOT
    depends_on:
      consul:
        condition: service_healthy
    # a one-shot job: retry a few times if the import fails, like the Kubernetes Job (backoffLimit)
    restart: "on-failure:3"
    # hardening: no root, nothing writable but /tmp (the Vert.x client creates its cache there), no capability
    user: "10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: 8500
      CONSUL_KV_PREFIX: frog
      CONSUL_KV_VERSION: 1.2.3
      CONSUL_FILES_FORMAT: YAML
      CONSUL_FILES_TARGET: dev
      CONSUL_FILES_ROOT_PATH: /configurations
      # with ACLs enabled, pass the token from the environment of the host instead of writing it here:
      # CONSUL_ACL_TOKEN: ${CONSUL_ACL_TOKEN}
    volumes:
      - ./src/test/resources/files:/configurations:ro
